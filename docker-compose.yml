services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: architect
      POSTGRES_PASSWORD: architect
      POSTGRES_USER: architect
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architect -d architect"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
